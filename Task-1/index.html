<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .glass {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 0, 0, 0.05);
    }
    .btn {
      @apply text-white text-xl font-semibold py-3 rounded-full shadow-md transition duration-200;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center px-4">

  <!-- Centered Calculator -->
  <div class="relative w-full max-w-sm">

    <!-- Top Bar -->
    <div class="h-2 w-full bg-indigo-500 rounded-t-2xl"></div>

    <!-- Calculator Card -->
    <div class="glass p-6 rounded-b-2xl shadow-xl border border-indigo-300">
      <h1 class="text-gray-800 text-3xl font-bold text-center mb-5">🧮 Calculator</h1>

      <!-- Display -->
      <input id="display" type="text" class="w-full mb-4 p-4 text-right text-2xl bg-white text-gray-800 rounded-lg border border-gray-300 focus:outline-none shadow-sm" disabled />

      <!-- Operator Buttons -->
      <div class="grid grid-cols-5 gap-2 mb-5">
        <button class="btn bg-red-400 hover:bg-red-500 col-span-1" onclick="clearDisplay()">C</button>
        <button class="btn bg-purple-400 hover:bg-purple-500" onclick="append('+')">＋</button>
        <button class="btn bg-purple-400 hover:bg-purple-500" onclick="append('-')">−</button>
        <button class="btn bg-purple-400 hover:bg-purple-500" onclick="append('*')">×</button>
        <button class="btn bg-purple-400 hover:bg-purple-500" onclick="append('/')">÷</button>
      </div>

      <!-- Number Buttons -->
      <div class="grid grid-cols-3 gap-3">
        <button class="btn bg-blue-300 hover:bg-blue-400" onclick="append('7')">7</button>
        <button class="btn bg-blue-300 hover:bg-blue-400" onclick="append('8')">8</button>
        <button class="btn bg-blue-300 hover:bg-blue-400" onclick="append('9')">9</button>

        <button class="btn bg-blue-200 hover:bg-blue-300" onclick="append('4')">4</button>
        <button class="btn bg-blue-200 hover:bg-blue-300" onclick="append('5')">5</button>
        <button class="btn bg-blue-200 hover:bg-blue-300" onclick="append('6')">6</button>

        <button class="btn bg-blue-100 hover:bg-blue-200" onclick="append('1')">1</button>
        <button class="btn bg-blue-100 hover:bg-blue-200" onclick="append('2')">2</button>
        <button class="btn bg-blue-100 hover:bg-blue-200" onclick="append('3')">3</button>

        <button class="btn bg-blue-50 hover:bg-blue-100 col-span-2" onclick="append('0')">0</button>
        <button class="btn bg-blue-50 hover:bg-blue-100" onclick="append('.')">.</button>
      </div>

      <!-- Equal Button -->
      <div class="mt-4">
        <button class="btn bg-green-400 hover:bg-green-500 w-full" onclick="calculate()">=</button>
      </div>
    </div>

    <!-- Bottom Bar -->
    <div class="h-2 w-full bg-indigo-500 rounded-b-2xl"></div>
  </div>

  <!-- Script -->
  <script>
    const display = document.getElementById('display');

    function append(value) {
      display.value += value;
    }

    function clearDisplay() {
      display.value = '';
    }

    function calculate() {
      try {
        display.value = eval(display.value);
      } catch {
        display.value = 'Error';
      }
    }
  </script>

</body>
</html>
