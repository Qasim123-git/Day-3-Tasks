<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Modern Calculator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .glass {
      background: rgba(255, 255, 255, 0.139);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .btn {
      @apply text-white text-xl font-semibold py-3 rounded-xl shadow-md transition duration-200;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 min-h-screen flex items-center justify-center">

  <div class="glass p-6 rounded-3xl w-80 shadow-2xl">
    <h2 class="text-white text-3xl font-bold text-center mb-6">🧮 Calculator</h2>
    <input id="display" type="text" class="w-full mb-6 p-4 text-right text-2xl bg-white/10 text-white rounded-xl border border-white/30" disabled />

    <div class="grid grid-cols-4 gap-4">
      <button class="btn bg-pink-500 hover:bg-pink-600" onclick="append('7')">7</button>
      <button class="btn bg-pink-500 hover:bg-pink-600" onclick="append('8')">8</button>
      <button class="btn bg-pink-500 hover:bg-pink-600" onclick="append('9')">9</button>
      <button class="btn bg-red-500 hover:bg-red-600" onclick="clearDisplay()">C</button>

      <button class="btn bg-pink-400 hover:bg-pink-500" onclick="append('4')">4</button>
      <button class="btn bg-pink-400 hover:bg-pink-500" onclick="append('5')">5</button>
      <button class="btn bg-pink-400 hover:bg-pink-500" onclick="append('6')">6</button>
      <button class="btn bg-purple-500 hover:bg-purple-600" onclick="append('+')">+</button>

      <button class="btn bg-pink-300 hover:bg-pink-400" onclick="append('1')">1</button>
      <button class="btn bg-pink-300 hover:bg-pink-400" onclick="append('2')">2</button>
      <button class="btn bg-pink-300 hover:bg-pink-400" onclick="append('3')">3</button>
      <button class="btn bg-purple-500 hover:bg-purple-600" onclick="append('-')">-</button>

      <button class="btn bg-pink-200 hover:bg-pink-300" onclick="append('0')">0</button>
      <button class="btn bg-pink-200 hover:bg-pink-300" onclick="append('.')">.</button>
      <button class="btn bg-green-500 hover:bg-green-600 col-span-2" onclick="calculate()">=</button>
    </div>

    <div class="grid grid-cols-2 gap-4 mt-4">
      <button class="btn bg-purple-500 hover:bg-purple-600" onclick="append('*')">*</button>
      <button class="btn bg-purple-500 hover:bg-purple-600" onclick="append('/')">/</button>
    </div>
  </div>

  <script>
    const display = document.getElementById('display');

    function append(value) {
      display.value += value;
    }

    function clearDisplay() {
      display.value = '';
    }

    function calculate() {
      try {
        display.value = eval(display.value);
      } catch {
        display.value = 'Error';
      }
    }
  </script>

</body>
</html>
